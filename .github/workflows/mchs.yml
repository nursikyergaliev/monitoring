name: MChS News Monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mchs-news-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеки
        run: |
          pip install requests feedparser

      - name: Запустить монитор
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Сохранить список отправленных новостей
        run: |
          git config user.name "mchs-news-bot"
          git config user.email "mchs-news-bot@users.noreply.github.com"

          git add data/sent.json

          if git diff --cached --quiet; then
            echo "Новых изменений нет"
          else
            git commit -m "Update sent news"
            git push
          fi
